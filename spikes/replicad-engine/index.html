<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Replicad Engine Spike</title>
    <style>
      :root { font: 14px/1.4 system-ui, sans-serif; color-scheme: light dark; }
      body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: #16181d; color: #e8e8ea; }
      #controls { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 10px 16px; }
      label { display: flex; align-items: center; gap: 8px; }
      #status { padding: 0 16px 10px; color: #a9adb6; font-variant-numeric: tabular-nums; }
      #viewport { flex: 1; min-height: 0; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="controls">
      <label>Arcade button position <input id="button-u" type="range" min="50" max="74" step="0.5" value="62" /></label>
      <label>Separate halves <input id="explode" type="range" min="0" max="80" step="1" value="0" /></label>
    </div>
    <div id="status">Loading engine…</div>
    <div id="viewport"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
